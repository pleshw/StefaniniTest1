version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      testing:
        patterns: ["xunit*", "Shouldly", "NSubstitute", "NetArchTest*", "Testcontainers*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /orders/src/Orders.Api
      - /orders/src/Orders.Worker
      - /orders/src/Orders.Bff
      - /catalog/src/Catalog.Api
    schedule:
      interval: weekly

  # npm for /web is added by step C45, when web/package.json exists.
