name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read

jobs:
  languages:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # TypeScript is analyzed from the moment web/ exists (C45); CodeQL fails on a language with no sources.
      - id: m
        run: |
          langs='["csharp"]'
          if [[ -f web/package.json ]]; then langs='["csharp","javascript-typescript"]'; fi
          echo "matrix={\"language\":${langs}}" >> "$GITHUB_OUTPUT"

  analyze:
    needs: languages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.languages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          category: /language:${{ matrix.language }}

  # Single required check name for branch protection, whatever the language matrix is.
  CodeQL:
    if: always()
    needs: [languages, analyze]
    runs-on: ubuntu-latest
    steps:
      - name: Every analysis succeeded
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success")'
