name: orders-platform

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./deploy/mongo/init-replica.js:/scripts/init-replica.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--file", "/scripts/init-replica.js"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-definitions.conf:ro
      - ./deploy/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  catalog-api:
    build:
      context: .
      dockerfile: catalog/src/Catalog.Api/Dockerfile
    environment:
      Mongo__ConnectionString: mongodb://mongo:27017/?replicaSet=rs0
      Catalog__Seed__Enabled: "true"  # development catalog; staging and production never set it
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "Catalog.Api.dll", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # Applies the EF Core migrations and Wolverine's tables, then exits; orders-api waits for it to complete.
  orders-migrator:
    build:
      context: .
      dockerfile: orders/src/Orders.Infrastructure/Migrator.Dockerfile
    environment:
      ConnectionStrings__Orders: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Orders__Messaging__Enabled: "false"  # the migrator only creates tables; it never connects to RabbitMQ
      Orders__Confirmation__SeedEnabled: "true"  # development rule: hold BRL orders above 5,000.00; staging and production never set it
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  orders-api:
    build:
      context: .
      dockerfile: orders/src/Orders.Api/Dockerfile
    environment:
      ConnectionStrings__Orders: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      orders-migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "Orders.Api.dll", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  orders-worker:
    build:
      context: .
      dockerfile: orders/src/Orders.Worker/Dockerfile
    environment:
      ConnectionStrings__Orders: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      orders-migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "Orders.Worker.dll", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  orders-bff:
    build:
      context: .
      dockerfile: orders/src/Orders.Bff/Dockerfile
    environment:
      # Development sign-in (placeholder for an identity provider); staging and production never set it.
      Bff__DevLogin__Enabled: "true"
      Bff__DevLogin__ShopperPassword: ${BFF_SHOPPER_PASSWORD:?set BFF_SHOPPER_PASSWORD in .env}
      Bff__DevLogin__AdminPassword: ${BFF_ADMIN_PASSWORD:?set BFF_ADMIN_PASSWORD in .env}
    depends_on:
      orders-api:
        condition: service_healthy
      catalog-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "Orders.Bff.dll", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # The only service that publishes a host port in the default profile.
  nginx:
    image: nginx:1.31-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/html:/usr/share/nginx/html:ro
    depends_on:
      orders-bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  # Profile "observability": docker compose --profile observability up -d --wait
  # Both images are distroless, so they have no shell for a healthcheck.
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector:0.163.2
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otelcol/collector.yaml:ro
    depends_on:
      - aspire-dashboard
    restart: unless-stopped

  aspire-dashboard:
    profiles: [observability]
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "127.0.0.1:${ASPIRE_DASHBOARD_PORT:-18888}:18888"
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
  mongo-config:
  rabbitmq-data:
