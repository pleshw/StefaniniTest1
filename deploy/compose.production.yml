# Production stack, deployed by scripts/deploy.sh. Images are referenced by digest through
# releases/current.env (<SERVICE>_IMAGE variables); settings come from deploy/.env (the ENV_FILE secret).
# The web image (C45) is added to this file together with its image.
name: orders-production

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in ENV_FILE}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ENV_FILE}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in ENV_FILE}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./mongo/init-replica.js:/scripts/init-replica.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--file", "/scripts/init-replica.js"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in ENV_FILE}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in ENV_FILE}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-definitions.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  catalog-api:
    image: ${CATALOG_API_IMAGE:?missing in releases/current.env}
    environment:
      Mongo__ConnectionString: mongodb://mongo:27017/?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "Catalog.Api.dll", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  orders-migrator:
    image: ${ORDERS_MIGRATOR_IMAGE:?missing in releases/current.env}
    environment:
      ConnectionStrings__Orders: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Orders__Messaging__Enabled: "false"  # the migrator only creates tables; it never connects to RabbitMQ
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  orders-api:
    image: ${ORDERS_API_IMAGE:?missing in releases/current.env}
    environment:
      ConnectionStrings__Orders: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      orders-migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "Orders.Api.dll", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  orders-worker:
    image: ${ORDERS_WORKER_IMAGE:?missing in releases/current.env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "Orders.Worker.dll", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  orders-bff:
    image: ${ORDERS_BFF_IMAGE:?missing in releases/current.env}
    depends_on:
      orders-api:
        condition: service_healthy
      catalog-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "Orders.Bff.dll", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.31-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      orders-bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
  mongo-config:
  rabbitmq-data:
