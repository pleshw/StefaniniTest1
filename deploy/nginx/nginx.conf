worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;

  # Docker's embedded DNS; resolving per request lets nginx start before the BFF is reachable.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Every response, the BFF's included (the locations below add no headers of their own, so they inherit these).
    # The pages load only their own bundled scripts, styles and fonts; Bootstrap's icons are data: images.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location /bff/ {
      set $bff http://orders-bff:8080;
      proxy_pass $bff;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
